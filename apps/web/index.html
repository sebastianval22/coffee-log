<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf6f1" />
    <meta name="description" content="Registro personal de los cafés que he probado" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Coffee Log" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Coffee Log</title>
    <script>
      // Installed iOS app: on launch WebKit can hand the page a viewport shorter than the
      // screen (the tab bar floats) until the first scroll. The fix strategy is switchable
      // from Ajustes → Pantalla so it can be compared on the device, and viewport sizes are
      // logged at launch for that screen.
      ;(function () {
        var standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches
        var root = document.documentElement
        var mode = 'vh'
        try {
          mode = localStorage.getItem('viewportFix') || 'vh'
        } catch (e) {}
        var log = (window.__viewportLog = [])
        window.__viewportFix = standalone ? mode : 'browser'
        if (standalone) root.dataset.viewportFix = mode

        function measure(label) {
          var probe = document.createElement('div')
          probe.style.cssText =
            'position:fixed;left:0;top:0;width:0;visibility:hidden;pointer-events:none;' +
            'padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)'
          document.body.appendChild(probe)
          var cs = getComputedStyle(probe)
          var sizes = {}
          ;['vh', 'svh', 'dvh', 'lvh'].forEach(function (unit) {
            probe.style.height = '100' + unit
            sizes[unit] = Math.round(parseFloat(getComputedStyle(probe).height))
          })
          log.push({
            label: label,
            innerHeight: innerHeight,
            clientHeight: root.clientHeight,
            visualViewport: window.visualViewport ? Math.round(visualViewport.height) : null,
            screen: screen.height,
            vh: sizes.vh,
            svh: sizes.svh,
            dvh: sizes.dvh,
            lvh: sizes.lvh,
            safeTop: cs.paddingTop,
            safeBottom: cs.paddingBottom,
          })
          probe.remove()
        }
        window.__measureViewport = measure

        document.addEventListener('DOMContentLoaded', function () {
          measure('al abrir')
          if (standalone && mode === 'nudge') {
            // Scroll the document by a pixel and back, like the drag that fixes it by hand.
            requestAnimationFrame(function () {
              root.style.height = 'calc(100vh + 1px)'
              scrollTo(0, 1)
              requestAnimationFrame(function () {
                scrollTo(0, 0)
                root.style.height = ''
                measure('tras el empujón')
              })
            })
          }
          setTimeout(function () {
            measure('1 s después')
          }, 1000)
        })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
